<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            border: 1px solid red;
            max-width: 1140px;
            margin: 0 auto;
        }

        .image-container {
            display: flex;
            gap: 10px;
        }

        .image-container div {
            width: 50%;
        }

        .image-container img {
            width: 100%;
            border: 1px solid red;
        }

        @media screen and (max-width: 576px){
            .image-container {
                flex-direction: column;
            }

            .image-container div {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Responsive Website</h1>
        <ol>
            <li>Viewport meta tag</li>
            <li>CSS Relative Unit</li>
            <li>body max and horizontal center align</li>
            <li>Image fluid</li>
            <li>two column flex and use media query with flex direction column</li>
            <li></li>
            <li></li>
        </ol>
    </header>
    <main>
        <div class="image-container">
            <div>
                <img src="./photo.jpg" alt="">
            </div>

            <div>
                <img src="./photo.jpg" alt="">
            </div>
        </div>


    </main>
</body>

</html>
